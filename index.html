<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team K — Homepage Concepts</title>
<meta name="description" content="Ten homepage design concepts for Team Karl Vermeulen, Harcourts Howick.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0B1F3A;--cyan:#00ADEF;--blue:#0077C8;--grey:#5B6B80;--line:#E3EAF2;--bg:#F5F8FB}
  *{box-sizing:border-box}
  body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--navy);background:var(--bg);line-height:1.6}
  header{background:var(--navy);color:#fff;padding:56px 20px 64px;text-align:center;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(135deg,var(--cyan) 0 14px,var(--navy) 14px 28px)}
  header img{height:40px;width:auto}
  header h1{font-weight:300;font-size:clamp(1.6rem,3.5vw,2.4rem);margin:28px 0 8px;letter-spacing:.01em}
  header p{margin:0 auto;max-width:640px;color:#C9D6E6}
  main{max-width:1240px;margin:0 auto;padding:48px 20px 72px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px}
  @media (max-width:400px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
  .card:hover{box-shadow:0 18px 40px -22px rgba(11,31,58,.35);transform:translateY(-2px)}
  .card a.thumb{display:block;aspect-ratio:16/10;background:var(--line);overflow:hidden;border-bottom:1px solid var(--line)}
  .card img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
  .body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:6px;flex:1}
  .num{font-size:.75rem;font-weight:600;letter-spacing:.14em;color:var(--blue);text-transform:uppercase}
  h2{margin:0;font-size:1.15rem;font-weight:600}
  .body p{margin:0;color:var(--grey);font-size:.93rem;flex:1}
  .go{margin-top:12px;align-self:flex-start;display:inline-flex;gap:8px;align-items:center;background:var(--navy);color:#fff;text-decoration:none;padding:10px 18px;border-radius:999px;font-size:.9rem;font-weight:500}
  .go:hover{background:var(--blue)}
  a:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
  footer{text-align:center;color:var(--grey);font-size:.85rem;padding:0 20px 48px}
  footer img{height:22px;width:auto;vertical-align:middle;margin-left:6px}
  @media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<header>
  <img src="assets/img/logo-white.png" alt="Team K" width="800" height="153">
  <h1>Homepage concepts for Team Karl Vermeulen</h1>
  <p>Ten design directions, all built with the Team K brand, the real team and real client reviews. Open each one, and let us know which direction feels most like you. Elements can be mixed and matched.</p>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>
<footer>Prepared for Team Karl Vermeulen · Harcourts Howick <img src="assets/img/harcourts-logo.png" alt="Harcourts" width="350" height="42"></footer>
<script>
const concepts = [
  ['01-classic-harcourts','Classic Harcourts','Polished and conventional. White and navy with cyan accents, a sunset hero and a clear, familiar layout. The safe choice, closest to the current site.'],
  ['02-editorial-luxury','Editorial Luxury','A high-end magazine feel. Elegant serif headings, warm off-white backdrop and generous whitespace. Quiet, premium and understated.'],
  ['03-coastal-eastern-beaches','Coastal Eastern Beaches','Lifestyle-led, celebrating the local coast. Rangitoto sunset hero, warm sand tones and soft curves. Relaxed but professional.'],
  ['04-bold-navy','Bold Navy Statement','Confident and high-contrast. Deep navy, big headlines, and the Harcourts tie stripe as a motif behind Karl.'],
  ['05-personal-karl','Personal — Meet Karl','Karl-first and warm. A personal letter from Karl, his story and signature, and the people behind every sale.'],
  ['06-results-data','Results & Proof','Numbers-led for sellers who want evidence. $845M sold, awards, and a visual 10-day sale timeline.'],
  ['07-minimal-swiss','Minimal Swiss','Architectural and precise. A strict grid, thin lines, light typography and lots of calm white space.'],
  ['08-warm-community','Friendly Local Team','Team-forward and approachable. Rounded, light-blue tones, big tap targets and easy click-to-call for every team member.'],
  ['09-split-sell-buy','Choose Your Path','Task-oriented. The homepage opens with a split screen: "I\'m selling" or "I\'m buying", each leading to its own section.'],
  ['10-bento-modern','Modern Bento','Contemporary tile layout. Stats, Karl, reviews, the timeline and listings in a tidy grid of cards.']
];
document.getElementById('grid').innerHTML = concepts.map(([slug,name,desc],i)=>`
  <article class="card">
    <a class="thumb" href="designs/${slug}/index.html" aria-label="Open concept ${i+1}: ${name}">
      <img src="designs/${slug}/thumb.jpg" alt="" width="720" height="450" loading="${i<3?'eager':'lazy'}" decoding="async">
    </a>
    <div class="body">
      <span class="num">Concept ${String(i+1).padStart(2,'0')}</span>
      <h2>${name}</h2>
      <p>${desc}</p>
      <a class="go" href="designs/${slug}/index.html">View concept <span aria-hidden="true">→</span></a>
    </div>
  </article>`).join('');
</script>
</body>
</html>
