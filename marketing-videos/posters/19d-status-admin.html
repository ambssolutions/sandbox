<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><title>Poster — WhatsApp status: still doing it by hand?</title>

<style>
  #frame { color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
