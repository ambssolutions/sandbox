<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><title>Poster — shared status: quotes and invoices</title>
<link rel="stylesheet" href="../engine/base.css"><link rel="stylesheet" href="_endorse.css"><link rel="stylesheet" href="_share2.css">
<style>
  h1 { position: absolute; left: 30px; right: 30px; top: 170px; text-align: center; font-size: 54px; }
  .rc { position: absolute; left: 50%; top: 300px; width: 400px; margin-left: -200px; background: #fff; color: var(--ink); padding: 22px 24px 30px;
    font-family: "Courier New", monospace; box-shadow: 0 24px 60px rgba(0,0,0,.5);
    -webkit-mask: radial-gradient(10px at 50% 100%, transparent 98%, #000) 50% 100% / 26px 100% repeat-x; }
  .rc .t { text-align: center; font-weight: 700; font-size: 20px; letter-spacing: .1em; }
  .rc .ln { margin-top: 12px; border-top: 2px dashed #c8ced8; padding-top: 10px; display: grid; gap: 12px; font-size: 21px; font-weight: 700; }
  .rc .ln div { display: flex; justify-content: space-between; }
  .rc .tot { margin-top: 12px; border-top: 2px dashed #c8ced8; padding-top: 12px; display: flex; justify-content: space-between; font-size: 28px; font-weight: 800; }
  .stamp { position: absolute; left: 50%; top: 572px; margin-left: -78px; padding: 8px 16px; border: 4px solid #2E9418; color: #2E9418; border-radius: 12px;
    font-size: 30px; font-weight: 800; rotate: -14deg; background: rgba(255,255,255,.85); font-family: "Bricolage Grotesque", sans-serif; }
  .bt { position: absolute; left: 30px; right: 30px; top: 680px; display: flex; justify-content: center; align-items: center; gap: 12px; }</style></head><body>
<div id="frame">
  <div class="stripe"></div>
  <div class="fwd"><div class="ar">↪</div><div><i>Forwarded</i><b>Sharing for a local business: <span>AMBS Solutions</span></b></div></div>

  <h1 class="hd">Invoices that <em>chase themselves.</em></h1>
  <div class="rc"><div class="t">INVOICE #1042</div>
    <div class="ln"><div><span>Job completed</span><span>✓</span></div><div><span>Invoice emailed</span><span>✓</span></div><div><span>Reminder sent</span><span>✓</span></div></div>
    <div class="tot"><span>TOTAL</span><span>$1,250</span></div></div>
  <div class="stamp">PAID ✓</div>
  <div class="bt"><img class="lg" src="../assets/ambs-logo.png" alt="AMBS"><div class="num hd">📞 022 099 9578</div></div>
</div></body></html>
