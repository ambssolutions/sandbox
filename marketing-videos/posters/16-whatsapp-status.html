<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><title>Poster — WhatsApp status (any digital needs)</title>
<link rel="stylesheet" href="../engine/base.css">
<style>
  /* 9:16 WhatsApp status in the ambs.co.nz brand (paper, ink, website green, the site's fonts).
     Built for status: few words, big type that survives WhatsApp's compression, and nothing important
     in the top ~9% (name and progress bar) or bottom ~13% (reply box). */
  @font-face { font-family: "Bricolage Grotesque"; src: url("../assets/bricolage-grotesque-latin.woff2") format("woff2"); font-weight: 500 800; }
  @font-face { font-family: "Instrument Sans"; src: url("../assets/instrument-sans-latin.woff2") format("woff2"); font-weight: 400 700; }
  :root { --paper: #EFF3F9; --ink: #101321; --mu: #5B6B84; --g: #2E9418; --gd: #1f6b10; --soft: #D3EFB9; --line: #dfe5ee; }
  #frame { display: flex; flex-direction: column; align-items: center; text-align: center; color: var(--ink);
    font-family: "Instrument Sans", Inter, sans-serif, var(--emoji);
    background: radial-gradient(90% 32% at 50% 8%, #D3EFB9 0%, transparent 70%), radial-gradient(70% 30% at 100% 100%, #dbe7f7 0%, transparent 70%), var(--paper); }
  .hd { font-family: "Bricolage Grotesque", Inter, sans-serif; }
  .logo { position: relative; margin-top: 84px; width: 220px; }
  h1 { position: relative; margin-top: 12px; font-size: 66px; line-height: .98; font-weight: 800; letter-spacing: -.035em; }
  h1 em { font-style: normal; color: var(--g); }
  .list { position: relative; margin-top: 22px; width: 440px; display: grid; gap: 12px; }
  .it { display: flex; align-items: center; gap: 16px; padding: 11px 20px; border-radius: 20px; background: #fff; border: 1px solid var(--line);
    box-shadow: 0 8px 22px rgba(16,19,33,.06); text-align: left; }
  .it .e { width: 48px; height: 48px; flex: none; border-radius: 14px; background: var(--soft); display: grid; place-items: center; font-size: 26px; }
  .it b { font-family: "Bricolage Grotesque", Inter, sans-serif; font-size: 27px; font-weight: 700; letter-spacing: -.01em; }
  .free { position: relative; margin-top: 16px; font-size: 22px; font-weight: 700; color: var(--gd); }
  .cta { position: relative; margin-top: 14px; width: 440px; border-radius: 26px; padding: 18px 18px 20px; background: var(--g); color: #fff;
    box-shadow: 0 18px 40px rgba(46,148,24,.3); }
  .cta .w { font-family: "Bricolage Grotesque", Inter, sans-serif; font-size: 44px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .cta .p { margin-top: 10px; font-size: 28px; font-weight: 700; }
</style></head><body>
<div id="frame">
  <img class="logo" src="../assets/ambs-logo.png" alt="AMBS Solutions">
  <h1 class="hd">Need anything<br><em>digital?</em></h1>
  <div class="list">
    <div class="it"><div class="e emoji">🌐</div><b>Websites</b></div>
    <div class="it"><div class="e emoji">⚙️</div><b>AI automation</b></div>
    <div class="it"><div class="e emoji">📱</div><b>Apps &amp; portals</b></div>
    <div class="it"><div class="e emoji">📊</div><b>Live dashboards</b></div>
  </div>
  <div class="free">✓ Free first session</div>
  <div class="cta"><div class="w">ambs.co.nz</div><div class="p"><span class="emoji">📞</span> 022 099 9578</div></div>
</div></body></html>
