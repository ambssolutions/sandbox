<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><title>Poster — WhatsApp status option B (text status)</title>
<link rel="stylesheet" href="../engine/base.css"><link rel="stylesheet" href="_status.css">
<style>
  /* Looks like a native WhatsApp text status: one bold line on a solid colour. */
  #frame { color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(70% 40% at 50% 30%, #3fb326 0%, transparent 70%), linear-gradient(180deg, #2E9418, #1f6b10); }
  #frame::before { background-image: radial-gradient(rgba(255,255,255,.10) 1.5px, transparent 2px); background-size: 26px 26px; }
  .wrap { position: relative; margin-top: -40px; padding: 0 34px; }
  .e { font-size: 64px; }
  h1 { margin-top: 10px; font-size: 52px; line-height: 1.06; font-weight: 800; letter-spacing: -.025em; }
  h1 u { text-decoration: none; background: #fff; color: var(--g); padding: 0 10px; border-radius: 12px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .s { margin-top: 18px; font-size: 22px; font-weight: 600; color: #e6f7dc; }
  .card { margin: 30px auto 0; width: 400px; border-radius: 24px; background: #fff; color: var(--ink); padding: 16px 16px 18px; box-shadow: 0 18px 44px rgba(10,40,5,.35); }
  .card img { width: 150px; }
  .card .p { margin-top: 6px; font-size: 27px; font-weight: 800; }
  .card .w { margin-top: 2px; font-size: 18px; font-weight: 700; color: var(--mu); }
</style></head><body>
<div id="frame"><div class="wrap">
  <div class="e emoji">👋</div>
  <h1 class="hd">Need a <u>website</u>,<br>an <u>app</u> or<br><u>less admin?</u></h1>
  <div class="s">Talk to AMBS. Your first session is free.</div>
  <div class="card"><img src="../assets/ambs-logo.png" alt="AMBS"><div class="p hd"><span class="emoji">💬</span> 022 099 9578</div><div class="w">ambs.co.nz</div></div>
</div></div></body></html>
