<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><title>Poster — endorse AMBS: recommended-by seal</title>

<style>
  /* WhatsApp status the sharer signs: a "Recommended by" line to write their name on with WhatsApp's text or pen tool. */
  #frame { color: var(--ink); display: flex; flex-direction: column; align-items: center; text-align: center;

  .what { margin-top: 12px; font-size: 21px; font-weight: 700; color: var(--mu); }
  .sig { margin-top: 36px; width: 420px; text-align: left; }
  .sig small { font-size: 15px; font-weight: 700; color: var(--mu); letter-spacing: .04em; }
  .sig .ln { margin-top: 26px; border-bottom: 3px dashed #9fb0c8; position: relative; }
  .sig .ln span { position: absolute; right: 0; top: -30px; font-size: 14px; font-weight: 600; color: #9fb0c8; }
