<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><title>Poster — WhatsApp status: three big words</title>
<link rel="stylesheet" href="../engine/base.css"><link rel="stylesheet" href="_status.css">
<style>
  #frame { color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(90% 34% at 50% 6%, #D3EFB9 0%, transparent 70%), var(--paper); }
  .wrap { margin-top: -30px; }
  .logo { width: 230px; }
  h1 { margin-top: 30px; font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -.04em; }
  h1 span:nth-child(2) { color: var(--g); }
  .s { margin-top: 22px; font-size: 22px; font-weight: 600; color: var(--mu); }
  .btn { margin-top: 34px; display: inline-flex; gap: 10px; align-items: center; padding: 16px 28px; border-radius: 999px; background: var(--g); color: #fff;
    font-size: 30px; font-weight: 800; box-shadow: 0 16px 36px rgba(46,148,24,.3); }
  .w { margin-top: 14px; font-size: 22px; font-weight: 700; }
</style></head><body>
<div id="frame"><div class="wrap">
  <img class="logo" src="../assets/ambs-logo.png" alt="AMBS Solutions">
  <h1 class="hd"><span>Websites.</span><br><span>Apps.</span><br><span>Automation.</span></h1>
  <div class="s">For NZ businesses. First session free.</div>
  <div class="btn hd"><span class="emoji">💬</span> 022 099 9578</div>
  <div class="w">ambs.co.nz</div>
</div></div></body></html>
