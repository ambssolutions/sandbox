<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><title>Poster — shared status: bookings and reminders</title>
<link rel="stylesheet" href="../engine/base.css"><link rel="stylesheet" href="_endorse.css"><link rel="stylesheet" href="_share2.css">
<style>
  .ls { position: absolute; left: 0; right: 0; top: 160px; text-align: center; }
  .ls .tm { font-size: 118px; font-weight: 800; letter-spacing: -.04em; line-height: 1; font-family: "Bricolage Grotesque", sans-serif; }
  .ls .dt { margin-top: 4px; font-size: 20px; font-weight: 600; color: var(--mu); }
  .nl { position: absolute; left: 30px; right: 30px; top: 330px; display: grid; gap: 10px; }
  .n { display: flex; gap: 12px; align-items: center; padding: 13px 15px; border-radius: 20px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); text-align: left; }
  .n .ic { width: 40px; height: 40px; border-radius: 11px; background: #2E9418; display: grid; place-items: center; font-size: 20px; flex: none; }
  .n b { display: block; font-size: 17px; font-weight: 700; } .n span { display: block; font-size: 14px; color: var(--mu); font-weight: 600; }
  .n small { margin-left: auto; align-self: flex-start; font-size: 12px; color: var(--mu); }
  h1 { position: absolute; left: 30px; right: 30px; top: 600px; text-align: center; font-size: 48px; }
  .bt { position: absolute; left: 30px; right: 30px; top: 724px; display: flex; justify-content: center; align-items: center; gap: 12px; }</style></head><body>
<div id="frame">
  <div class="stripe"></div>
  <div class="fwd"><div class="ar">↪</div><div><i>Forwarded</i><b>Sharing for a local business: <span>AMBS Solutions</span></b></div></div>

  <div class="ls"><div class="tm">9:41</div><div class="dt">Tuesday 4 November</div></div>
  <div class="nl">
    <div class="n"><div class="ic emoji">📅</div><div><b>New booking</b><span>Sarah booked Thursday, 10am</span></div><small>now</small></div>
    <div class="n"><div class="ic emoji">🔔</div><div><b>Reminder sent</b><span>“See you tomorrow at 2pm, Tom”</span></div><small>9:30</small></div>
    <div class="n"><div class="ic emoji">✅</div><div><b>Booking confirmed</b><span>Mere replied YES</span></div><small>9:12</small></div>
  </div>
  <h1 class="hd">Bookings in. <em>Fewer no‑shows.</em></h1>
  <div class="bt"><img class="lg" src="../assets/ambs-logo.png" alt="AMBS"><div class="num hd">📞 022 099 9578</div></div>
</div></body></html>
