<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><title>Thumbnail — Halloween scares</title>
<link rel="stylesheet" href="../engine/base.css"><link rel="stylesheet" href="thumbs.css">
<style>
  #frame { background: radial-gradient(70% 35% at 80% 8%, rgba(255,138,31,.4), transparent 70%), radial-gradient(60% 40% at 0% 100%, rgba(123,77,255,.3), transparent 70%), linear-gradient(180deg, #0d0f1a, #171028); }
  .tlogo { filter: none; background: #fff; padding: 10px 18px; border-radius: 20px; }
  .kicker { color: #ffb36b; }
  h1 { text-shadow: none; font-size: 44px; white-space: nowrap; }
  h1 mark { background: #ff8a1f; color: #1a0d00; }
  .pk { margin-top: 10px; font-size: 120px; line-height: 1; }
  .ls { margin: 18px auto 0; width: 440px; display: grid; gap: 10px; text-align: left; }
  .ls div { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 16px; background: rgba(255,138,31,.12); border: 1.5px solid rgba(255,138,31,.5); font-size: 20px; font-weight: 800; }
  .ls div span { margin-left: auto; font-size: 13px; font-weight: 900; color: #fff; background: #2E9418; padding: 4px 10px; border-radius: 999px; }
  .cta { color: #fff; } .cta span { background: #ff8a1f; color: #1a0d00; box-shadow: 0 4px 0 #b35500; }
</style></head><body>
<div id="frame">
  <img class="tlogo" src="../assets/ambs-logo.png" alt="AMBS">
  <div class="kicker">HAPPY HALLOWEEN</div>
  <h1>The <mark>scariest</mark> things<br>in a small business</h1>
  <div class="pk emoji">🎃</div>
  <div class="ls"><div>👻 Missed calls<span>FIXED</span></div><div>🧟 Typing it all twice<span>FIXED</span></div><div>💀 Unpaid invoices<span>FIXED</span></div><div>🕸️ No website<span>FIXED</span></div></div>
  <div class="cta">Comment <span>BOO</span> 👻</div>
</div>
</body></html>
