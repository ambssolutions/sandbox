<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><title>Thumbnail — AMBS brand</title>

<style>

  .steps { position: relative; margin-top: 24px; display: flex; gap: 8px; font-size: 15px; font-weight: 800; color: var(--muted); align-items: center; }
  .steps span { background: rgba(34,197,94,.14); border: 1px solid rgba(34,197,94,.5); color: #bbf7d0; padding: 6px 11px; border-radius: 999px; }
</style></head><body>
<div id="frame">
  <img class="tlogo" src="../assets/ambs-logo.png" alt="AMBS">
  <div class="kicker">AI AUTOMATION &amp; WEBSITES · NZ</div>

  <div class="g">
    <div><div class="e emoji">🧾</div><b>Quotes &amp; invoices</b></div>
    <div><div class="e emoji">💬</div><b>Customer replies</b></div>
    <div><div class="e emoji">📅</div><b>Bookings &amp; reminders</b></div>
    <div class="d"><div class="e emoji">🌐</div><b>Websites that win trust</b></div>
    <div class="d"><div class="e emoji">📱</div><b>Staff &amp; customer portals</b></div>
    <div class="d"><div class="e emoji">📊</div><b>Live dashboards</b></div>
  </div>
  <div class="steps"><span><i class="emoji" style="font-style:normal">👀</i> We watch</span>→<span><i class="emoji" style="font-style:normal">⚙️</i> We build</span>→<span><i class="emoji" style="font-style:normal">🔑</i> You own it</span></div>
  <div class="cta" style="margin-top:26px">Comment <span>HELP</span> for a free session</div>
</div></body></html>
