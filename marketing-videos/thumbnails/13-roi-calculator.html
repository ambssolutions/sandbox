<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><title>Thumbnail — website ROI calculator</title>
<link rel="stylesheet" href="../engine/base.css"><link rel="stylesheet" href="thumbs.css">
<link rel="stylesheet" href="../engine/theme-cobalt.css">
<style>
  .tlogo { filter: none; background: #fff; padding: 10px 18px; border-radius: 20px; box-shadow: 0 10px 26px rgba(5,15,60,.35); }
  .kicker { color: var(--accent); }
  h1 { color: #fff; text-shadow: none; font-size: 50px; line-height: 1.12; }
  h1 mark { background: var(--accent); color: var(--dark); }
  .card { margin: 26px auto 0; width: 440px; border-radius: 26px; background: #fff; color: var(--card-ink); padding: 18px 20px 20px;
    box-shadow: 0 26px 60px rgba(5,15,60,.45); position: relative; }
  .card .ey { font-size: 11px; font-weight: 900; letter-spacing: .14em; color: #2152e0; }
  .sl { margin-top: 12px; }
  .sl .row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; }
  .sl .row b { color: #2152e0; font-size: 17px; }
  .sl .tr { position: relative; margin-top: 7px; height: 10px; border-radius: 6px; background: #e2e8f0; }
  .sl .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: #2152e0; }
  .sl .tr u { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #fff; border: 4px solid #2152e0; }
  .res { margin-top: 16px; text-align: center; border-radius: 18px; background: var(--dark); color: #fff; padding: 14px 10px; }
  .res b { display: block; font-size: 54px; font-weight: 900; letter-spacing: -.04em; line-height: 1; color: var(--accent); }
  .res span { display: block; margin-top: 6px; font-size: 14px; font-weight: 700; color: #c9d8ff; }
  .eg { position: absolute; right: 16px; top: 14px; font-size: 10px; font-weight: 900; letter-spacing: .08em; color: #64748b; background: #f1f5f9; padding: 3px 8px; border-radius: 999px; }
  .cta { margin-top: 26px; color: #fff; }
  .cta span { background: var(--accent); color: var(--dark); box-shadow: 0 4px 0 #b8a000; }
</style></head><body>
<div id="frame">
  <img class="tlogo" src="../assets/ambs-logo.png" alt="AMBS">
  <div class="kicker">FREE WEBSITE ROI CALCULATOR</div>
  <h1>What could your<br><mark>website earn you?</mark></h1>
  <div class="card"><div class="ey">MOVE THE SLIDERS</div><div class="eg">EXAMPLE</div>
    <div class="sl"><div class="row">Average job value <b>$5,000</b></div></div>
    <div class="sl"><div class="row">Website visitors a month <b>150</b></div><div class="tr"><i style="width:13%"></i><u style="left:13%"></u></div></div>
    <div class="sl"><div class="row">Visitors who send an enquiry <b>2%</b></div><div class="tr"><i style="width:20%"></i><u style="left:20%"></u></div></div>
    <div class="sl"><div class="row">Enquiries you win <b>35%</b></div><div class="tr"><i style="width:42%"></i><u style="left:42%"></u></div></div>
    <div class="res"><b>$63,000</b><span>of work your website could bring in a year</span></div>
  </div>
  <div class="cta">Try yours at <span>ambs.co.nz</span></div>
</div>
</body></html>
