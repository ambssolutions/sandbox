<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><title>Thumbnail — book your free session</title>
<link rel="stylesheet" href="../engine/base.css"><link rel="stylesheet" href="thumbs.css">
<link rel="stylesheet" href="../engine/theme-website.css">
<style>
  .tlogo { filter: none; }
  h1 { text-shadow: none; font-size: 54px; }
  h1 mark { background: var(--accent); color: #fff; }
  .card { margin: 26px auto 0; width: 440px; border-radius: 24px; background: #fff; border: 1px solid #dfe5ee; padding: 18px 20px; text-align: left;
    box-shadow: 0 20px 46px rgba(16,19,33,.12); }
  .card .r { display: flex; gap: 14px; align-items: center; padding: 10px 0; font-size: 20px; font-weight: 800; border-bottom: 1px solid #eef1f6; }
  .card .r:last-child { border: 0; }
  .card .r i { font-style: normal; width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 18px; flex: none; }
  .card .r span { display: block; font-size: 14px; font-weight: 600; color: var(--muted); }
  .cta { color: var(--muted); }
  .cta span { background: var(--accent); color: #fff; box-shadow: 0 4px 0 #1f6b10; }
</style></head><body>
<div id="frame">
  <img class="tlogo" src="../assets/ambs-logo.png" alt="AMBS">
  <div class="kicker">AMBS SOLUTIONS</div>
  <h1>Your first session<br>is <mark>free.</mark></h1>
  <div class="card">
    <div class="r"><i>1</i><div>We watch the work<span>with whoever actually does the job</span></div></div>
    <div class="r"><i>2</i><div>You get a written plan<span>plus an hours estimate</span></div></div>
    <div class="r"><i>3</i><div>It’s yours to keep<span>even if you don’t hire us</span></div></div>
  </div>
  <div class="cta">Comment <span>BOOK</span> 👇</div>
</div>
</body></html>
