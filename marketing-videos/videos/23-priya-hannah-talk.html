<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<title>AMBS — Priya &amp; Hannah talk to camera (HELLO)</title>
<link rel="stylesheet" href="../engine/base.css">
<style>
  /* Talking presenters, full screen. The presenters are AI photos of fictional people (made in Weave);
     tools/lipsync.py moves their mouths with the voice track and writes the clips this page plays. */
  .progress, .brand, .caption, .end { display: none !important; }
  #frame { font-family: Inter, sans-serif, var(--emoji); color: #fff; overflow: hidden; background: #111; }
  #frame::before { display: none; }
  .cam { position: absolute; inset: 0; overflow: hidden; }
  .cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .vig { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35), transparent 18%, transparent 52%, rgba(6,10,40,.82) 100%); }

  .logo { position: absolute; left: 20px; top: 64px; height: 40px; background: #fff; padding: 6px 11px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
  .live { position: absolute; right: 20px; top: 72px; padding: 6px 11px; border-radius: 999px; background: rgba(0,0,0,.45); font-size: 12px; font-weight: 800; letter-spacing: .12em; }
  .live i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff3b47; margin-right: 6px; }
  .tag { position: absolute; left: 20px; top: 540px; padding: 7px 13px; border-radius: 12px; background: linear-gradient(90deg, #2152e0, #7c3aed); font-size: 17px; font-weight: 900; }
  .tag span { display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: #dfe4ff; }

  .chips { position: absolute; left: 20px; right: 20px; top: 610px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chips span { padding: 9px 13px; border-radius: 999px; background: #fff; color: #10173a; font-size: 16px; font-weight: 800; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
  .tk { position: absolute; left: 20px; right: 20px; padding: 10px 14px; border-radius: 16px; background: #fff; color: #10173a; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 24px rgba(0,0,0,.3); }
  .tk b { font-size: 34px; font-weight: 900; background: linear-gradient(90deg, #2152e0, #7c3aed); -webkit-background-clip: text; color: transparent; }
  .tk div { font-size: 16px; font-weight: 800; } .tk div span { display: block; font-size: 12.5px; font-weight: 600; color: #5b6390; }
  .end2 { position: absolute; left: 20px; right: 20px; top: 604px; display: flex; gap: 10px; align-items: center; }
  .end2 .kw { padding: 6px 16px 8px; border-radius: 14px; background: linear-gradient(90deg, #2152e0, #7c3aed); font-size: 40px; font-weight: 900; }
  .end2 .ph { padding: 10px 14px; border-radius: 999px; background: #fff; color: #10173a; font-size: 18px; font-weight: 900; }

  .cap { position: absolute; left: 24px; right: 24px; top: 742px; text-align: center; font-size: 25px; font-weight: 900; line-height: 1.22; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .cap .w { opacity: .45; } .cap .w.on { opacity: 1; } .cap .w.now { color: #ffd84d; }
  .sc { position: absolute; inset: 0; display: none; }
</style>
</head>
<body>
<div id="frame">
  <div class="cam" id="camP"><video id="vP" src="img/presenters/talk23-priya.webm" muted preload="auto" playsinline></video></div>
  <div class="cam" id="camH"><video id="vH" src="img/presenters/talk23-hannah.webm" muted preload="auto" playsinline></video></div>
  <div class="vig"></div>
  <img class="logo" src="../assets/ambs-logo.png" alt="AMBS"><div class="live"><i></i>AMBS SOLUTIONS</div>
  <div class="tag" id="tagP">Priya<span>AMBS PRESENTER</span></div>
  <div class="tag" id="tagH">Hannah<span>AMBS PRESENTER</span></div>

  <div class="sc" id="o2"><div class="chips"><span id="ch1">🌐 Fast websites</span><span id="ch2">🔐 Portals</span><span id="ch3">🤖 AI helpers</span></div></div>
  <div class="sc" id="o3">
    <div class="tk" id="t1" style="top:600px"><b>10%</b><div>Refer a business<span>You get 10% when they come on board</span></div></div>
    <div class="tk" id="t2" style="top:670px;display:none"><b>10%</b><div>Bring your own business<span>10% off your project</span></div></div></div>
  <div class="sc" id="o4"><div class="end2"><div class="kw">HELLO</div><div class="ph">📞 022 099 9578</div></div></div>
  <div class="cap" id="cap"></div>
</div>

<script src="../engine/engine.js"></script>
<script>
const { $, vis, p, ease } = E;
const PV = "hf_alpha", HV = "bf_emma+nz", SWITCH = 11.05;
window.COVER_AT = 2.2;
// what the captions show (the voice says the phone number in words)
const SHOW = ["Kia ora, I'm Priya. Want more customers from your website?",
  "AMBS Solutions builds fast websites, portals and AI helpers for Kiwi businesses.",
  "I'm Hannah. Refer a business and you get 10%. Bring your own, get 10% off.",
  "Call 022 099 9578, or just comment HELLO."];

E.setup({
  duration: 22.6,
  keyword: "HELLO",
  narrator: PV,
  // keep in step with the lines tools/lipsync.py was run with
  voice: [
    { a: 0.3, b: 4.8, voice: PV, text: "Kia ora, I'm Priya. Want more customers from your website?" },
    { a: 5.2, b: 10.8, voice: PV, text: "AMBS Solutions builds fast websites, portals, and AI helpers for Kiwi businesses." },
    { a: 11.3, b: 16.6, voice: HV, text: "I'm Hannah. Refer a business, and you get ten percent. Bring your own, get ten percent off." },
    { a: 17.0, b: 22.0, voice: HV, text: "Call oh two two, oh nine nine, nine five seven eight. Or just comment hello." },
  ],
  captions: [], phases: [],
  end: { at: 99, title: "", sub: "" },
});

// how long each line actually takes to say (from voice.py), so the words light up in time
const SAID = [3.55, 5.52, 4.6, 4.09];
let capLine = -1;
E.use((t) => {
  const hann = t >= SWITCH;
  $("#camP").style.display = hann ? "none" : "block"; $("#camH").style.display = hann ? "block" : "none";
  $("#tagP").style.display = hann ? "none" : "block"; $("#tagH").style.display = hann ? "block" : "none";
  // slow camera push-in and a little drift, like a handheld phone on a stand
  const cam = hann ? "#camH" : "#camP", t0 = hann ? SWITCH : 0;
  const z = 1.03 + 0.05 * p(t, t0, t0 + 11, ease.inOut);
  $(cam).style.transform = `scale(${z}) translate(${Math.sin(t * 0.7) * 3}px, ${Math.sin(t * 0.9) * 2}px)`;
  $(cam).style.transformOrigin = "50% 32%";
  vis(hann ? "#tagH" : "#tagP", t, t0 + 0.3, null, { x: -30, y: 0 });

  // overlays
  [["#o2", 5.2, 10.9], ["#o3", 11.3, 16.9], ["#o4", 17.0, 22.6]].forEach(([s, a, b]) => ($(s).style.display = t >= a && t < b ? "block" : "none"));
  ["#ch1", "#ch2", "#ch3"].forEach((s, i) => vis(s, t, 6.6 + i * 0.9, null, { y: 10, scale: 0.8 }));
  vis("#t1", t, 12.2, null, { x: -40, y: 0 });
  $("#t2").style.display = t >= 14.2 ? "flex" : "none"; vis("#t2", t, 14.2, null, { x: 40, y: 0 });
  vis("#o4 .kw", t, 18.8, null, { y: 0, scale: 0.6, dur: 0.3 }); vis("#o4 .ph", t, 17.3, null, { y: 10 });

  // karaoke captions: words light up through each line
  const i = E.voice.findIndex((l) => t >= l.a - 0.1 && t < l.b + 0.2);
  if (i !== capLine) { capLine = i; $("#cap").innerHTML = i < 0 ? "" : SHOW[i].split(" ").map((w) => `<span class="w">${w}</span>`).join(" "); }
  if (i >= 0) {
    const l = E.voice[i], ws = $("#cap").querySelectorAll(".w"), k = p(t, l.a, l.a + SAID[i] * 0.92) * ws.length;
    ws.forEach((w, j) => { w.classList.toggle("on", j < k); w.classList.toggle("now", j < k && j >= k - 1); });
  }
  return Promise.all([E.clip($("#vP"), Math.min(t, 11.15)), E.clip($("#vH"), t)]);
});
</script>
</body>
</html>
