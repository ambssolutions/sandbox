<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<title>AMBS — Halloween: the scariest things in a small business (BOO)</title>
<link rel="stylesheet" href="../engine/base.css">
<style>
  /* Halloween: AMBS dark ink with pumpkin orange; the fixes in AMBS website green. */
  :root { --bg: #0d0f1a; --bg2: #171028; --accent: #ff8a1f; --mark: #ff8a1f; --muted: #b6a9cf; --good: #2E9418; }
  #frame { background: radial-gradient(70% 35% at 80% 8%, rgba(255,138,31,.35), transparent 70%), radial-gradient(60% 40% at 0% 100%, rgba(123,77,255,.25), transparent 70%),
    linear-gradient(180deg, #0d0f1a, #171028); }
  #frame::before { background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.4px); background-size: 22px 22px; }
  .caption mark { background: var(--mark); color: #1a0d00; }
  .caption .cyan { color: #5cd13c; }
  .end { background: radial-gradient(80% 50% at 50% 35%, rgba(255,138,31,.22), transparent 70%), rgba(13,15,26,.97); }
  .end .kw span { background: #ff8a1f; color: #1a0d00; box-shadow: 0 10px 0 #b35500, 0 18px 40px rgba(255,138,31,.35); }

  .moon { position: absolute; right: 50px; top: 210px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff7d6, #ffd27a 60%, #e0a43a);
    box-shadow: 0 0 60px rgba(255,210,122,.5); }
  .bat { position: absolute; font-size: 34px; }
  .pump { position: absolute; left: 50%; top: 360px; margin-left: -80px; font-size: 140px; line-height: 1; }
  #hook { position: absolute; left: 26px; right: 26px; top: 560px; text-align: center; font-size: 34px; font-weight: 900; line-height: 1.12; }
  #hook em { font-style: normal; color: #ff8a1f; }

  .cnt { position: absolute; left: 26px; top: 226px; padding: 6px 12px; border-radius: 999px; background: rgba(255,138,31,.16); border: 1px solid rgba(255,138,31,.5);
    font-size: 13px; font-weight: 900; letter-spacing: .12em; color: #ffb36b; }
  .scare { position: absolute; left: 26px; right: 26px; top: 268px; border-radius: 24px; padding: 18px 20px 22px; background: rgba(255,138,31,.1); border: 2px solid rgba(255,138,31,.55); }
  .scare .lab { font-size: 13px; font-weight: 900; letter-spacing: .14em; color: #ffb36b; }
  .scare .row { margin-top: 8px; display: flex; gap: 14px; align-items: center; }
  .scare .e { font-size: 54px; flex: none; }
  .scare p { font-size: 28px; font-weight: 900; line-height: 1.12; }
  .fix { position: absolute; left: 26px; right: 26px; top: 468px; border-radius: 24px; padding: 18px 20px 22px; background: #fff; color: #101321;
    border: 3px solid #2E9418; box-shadow: 0 18px 44px rgba(46,148,24,.3); }
  .fix .lab { font-size: 13px; font-weight: 900; letter-spacing: .14em; color: #2E9418; }
  .fix p { margin-top: 6px; font-size: 23px; font-weight: 800; line-height: 1.25; }
  .stamp { position: absolute; right: 16px; top: -18px; padding: 6px 14px; border: 3px solid #2E9418; color: #2E9418; background: #fff; border-radius: 10px;
    font-size: 20px; font-weight: 900; letter-spacing: .08em; rotate: 7deg; }

  #calm { position: absolute; left: 26px; right: 26px; top: 250px; text-align: center; }
  #calm .g { font-size: 90px; }
  #calm h3 { margin-top: 10px; font-size: 40px; font-weight: 900; line-height: 1.1; }
  #calm h3 em { font-style: normal; color: #5cd13c; }
  #calm .p { margin-top: 24px; display: inline-block; padding: 14px 26px; border-radius: 999px; background: #2E9418; color: #fff; font-size: 26px; font-weight: 900;
    box-shadow: 0 16px 36px rgba(46,148,24,.35); }
</style>
</head>
<body>
<div id="frame">
  <!-- 0–3.6 hook -->
  <div class="moon" id="moon"></div>
  <div class="bat emoji" style="left:60px;top:240px">🦇</div><div class="bat emoji" style="left:200px;top:300px">🦇</div><div class="bat emoji" style="left:330px;top:250px">🦇</div>
  <div class="pump emoji" id="pump">🎃</div>
  <div id="hook">The <em>scariest</em> things in a small business…</div>

  <!-- 3.6–17.8 four scares -->
  <div class="cnt" id="cnt">SCARE 1 / 4</div>
  <div id="cards"></div>

  <!-- 17.8–22.6 nothing to fear -->
  <div id="calm"><div class="g emoji">😌</div><h3>Nothing to fear.<br><em>AMBS fixes all four.</em></h3><div class="p">Your first session is free</div></div>
</div>

<script src="../engine/engine.js"></script>
<script>
const { $, $$, vis } = E;
const SCARES = [
  ["👻", "Missed calls at 7pm, and the customer rings someone else", "Missed calls get a text straight away, so the customer isn’t lost."],
  ["🧟", "Typing the same job into three different apps", "Your apps are connected, so a job is typed once and moves on its own."],
  ["💀", "Invoices still unpaid after 60 days", "Polite reminders go out on a schedule, so you’re not the one chasing."],
  ["🕸️", "A website nobody can find, or no website at all", "A fast website that turns visitors into calls, and it’s yours to own."],
];
const S0 = 3.6, D = 3.55;
SCARES.forEach(([e, s, f], i) => $("#cards").insertAdjacentHTML("beforeend",
  `<div class="scare" data-s="${i}"><div class="lab">😱 SCARY</div><div class="row"><div class="e emoji">${e}</div><p>${s}</p></div></div>
   <div class="fix" data-f="${i}"><div class="lab">✓ THE AMBS FIX</div><p>${f}</p><div class="stamp">FIXED</div></div>`));
const bats = $$(".bat");
window.COVER_AT = 6.2;

E.setup({
  duration: 27,
  keyword: "BOO",
  voice: [
    { a: 0.15, b: 3.5, text: "Happy Halloween! The scariest things in a small business." },
    { a: 3.7, b: 7.1, text: "Missed calls at seven p.m. Fixed: they get a text straight away." },
    { a: 7.3, b: 10.6, text: "Typing jobs three times. Fixed: apps connected." },
    { a: 10.8, b: 14.2, text: "Unpaid invoices. Fixed: reminders chase them." },
    { a: 14.4, b: 17.7, text: "No one finds your website. Fixed: one that brings calls." },
    { a: 17.9, b: 22.4, text: "Nothing to fear. A M B S fixes all four, and your first session is free." },
    { a: 22.7, b: 26.9, text: "Want to scare off the admin? Comment, boo." },
  ],
  captions: [
    { a: 0, b: 3.6, html: `Happy Halloween! <mark>🎃</mark>` },
    { a: 3.6, b: 17.8, html: `4 things that <mark>scare</mark> business owners.` },
    { a: 17.8, b: 22.6, html: `<span class="cyan">Nothing to fear.</span>` },
  ],
  phases: [],
  end: { at: 22.6, title: "Scare off the admin 👻", sub: "Comment BOO and we’ll send you how to book your free session.", foot: "AI automation &amp; websites for NZ businesses" },
});

E.use((t) => {
  // hook
  vis("#moon", t, 0, 3.6, { y: 30, scale: 0.6 });
  vis("#pump", t, 0.3, 3.6, { y: 40, scale: 0.4, dur: 0.5 });
  bats.forEach((b, i) => { const op = vis(b, t, 0.5 + i * 0.25, 3.6, { y: 0, scale: 0.3 });
    if (op > 0) b.style.transform += ` translate(${Math.sin(t * 3 + i) * 14}px, ${Math.cos(t * 4 + i) * 8}px)`; });
  vis("#hook", t, 1.2, 3.6, { y: 20 });

  // scares
  vis("#cnt", t, S0, 17.8, { y: 0, scale: 0.8 });
  const k = Math.min(3, Math.max(0, Math.floor((t - S0) / D)));
  $("#cnt").textContent = `SCARE ${k + 1} / 4`;
  SCARES.forEach((_, i) => {
    const s = S0 + i * D;
    const op = vis(`[data-s="${i}"]`, t, s + 0.05, s + D, { x: -40, y: 0, outDur: 0.2 });
    if (op > 0 && t < s + 1.2) $(`[data-s="${i}"]`).style.transform += ` translateX(${Math.sin(t * 40) * 3}px)`;
    vis(`[data-f="${i}"]`, t, s + 1.4, s + D, { y: 40, outDur: 0.2 });
    vis(`[data-f="${i}"] .stamp`, t, s + 2.0, null, { scale: 2.4, y: 0, dur: 0.25 });
  });

  // calm
  vis("#calm", t, 17.9, 22.6, { y: 0, scale: 0.7, dur: 0.45 });
});
</script>
</body>
</html>
